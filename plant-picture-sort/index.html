<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plant Picture Sort</title>
<style>
  :root {
    color-scheme: light;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif;
    color: #204132;
    background: #faf5e7;
    --edge: #83a183;
    --focus: #1e5cb0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
  button:disabled { cursor: default; }
  main { max-width: 1140px; margin: 0 auto; padding: clamp(14px, 3vw, 36px); }
  header { display: flex; align-items: start; justify-content: space-between; gap: 14px; }
  h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.6rem); line-height: 1.02; letter-spacing: -.04em; }
  .directions { margin: 11px 0 0; font-size: clamp(1rem, 2.25vw, 1.24rem); line-height: 1.35; }
  .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .control {
    min-height: 42px; padding: 7px 11px; border: 2px solid #527454;
    border-radius: 10px; background: #fffef7; font-weight: bold; white-space: nowrap;
  }
  .control:hover:not(:disabled) { background: #e8f1dd; }
  .tray {
    margin-top: 18px; background: #eee7d6; border: 2px solid #dbd1b9;
    border-radius: 16px; padding: clamp(7px, 1.2vw, 12px);
  }
  .tray-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .count { font-size: .96rem; font-weight: bold; white-space: nowrap; }
  #return-picture { min-height: 32px; font-size: .88rem; padding: 4px 9px; }
  #return-picture:disabled { visibility: hidden; }
  .shelf {
    display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: clamp(5px, 1vw, 10px); align-content: start;
    min-height: calc(2 * (clamp(54px, 10vh, 98px) + 35px) + 10px);
  }
  .card {
    width: 100%; min-width: 0; display: flex; flex-direction: column; align-items: center;
    gap: 4px; padding: clamp(3px, .7vw, 6px); border: 2px solid #c9bb9e;
    border-radius: 11px; background: #fffef8; font-weight: bold;
    font-size: clamp(.82rem, 1.7vw, 1.02rem); touch-action: none; user-select: none;
  }
  .card:active { cursor: grabbing; }
  .card:hover, .card[aria-pressed="true"] { border-color: #27604a; }
  .card[aria-pressed="true"] { box-shadow: 0 0 0 3px #87bd8e; }
  .card img { height: clamp(54px, 10vh, 98px); }
  .picture {
    display: block; width: 100%; object-fit: contain; border-radius: 7px;
    background: var(--picture-bg); pointer-events: none;
  }
  .message {
    margin: 0; min-height: 44px; display: flex; align-items: center; justify-content: center;
    padding: 6px 2px; text-align: center; font-weight: bold;
    font-size: clamp(1rem, 2.5vw, 1.25rem);
  }
  .groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(7px, 2vw, 16px); }
  .group {
    display: flex; flex-direction: column; min-width: 0; padding: clamp(6px, 1.45vw, 12px);
    min-height: 174px; border-radius: 15px; border: 2px solid var(--edge);
    background: #edf5e1;
  }
  .group.ready { border-style: dashed; }
  .group.is-over, .tray.is-over { outline: 3px solid #347651; outline-offset: 2px; }
  .group-name {
    width: 100%; min-width: 0; height: 38px; border: 1px solid #83a183;
    border-radius: 8px; padding: 5px 9px; text-align: center; background: #fffef7;
    font-size: clamp(.93rem, 2vw, 1.15rem); font-weight: bold;
  }
  .group-name::placeholder { color: #56705e; opacity: 1; font-weight: normal; }
  .placed-list {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
    gap: 7px; margin-top: 9px; align-content: start;
  }
  .placed-list .card img { height: clamp(45px, 8vh, 73px); }
  .place-here { align-self: center; margin-top: auto; min-height: 37px; padding: 4px 11px; }
  .place-here:disabled { visibility: hidden; }
  .ghost {
    position: fixed; z-index: 10; left: 0; top: 0; display: grid; gap: 4px;
    justify-items: center; padding: 5px; pointer-events: none; border-radius: 10px;
    border: 2px solid #27604a; box-shadow: 0 8px 26px #203f3450;
    background: #fffef8; font-weight: bold; text-align: center;
  }
  .ghost img { height: clamp(52px, 10vh, 100px); }
  @media (max-width: 720px) {
    header { display: block; }
    .toolbar { margin-top: 9px; }
    .shelf { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media (max-width: 440px) {
    .shelf { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .group { min-height: 134px; }
    .placed-list { grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Plant Picture Sort</h1>
      <p class="directions">Make your own groups. Drag a picture or tap it and then tap a group.</p>
    </div>
    <div class="toolbar">
      <button class="control" id="add-group" type="button">Add a group</button>
      <button class="control" id="reset" type="button">Play again</button>
    </div>
  </header>

  <section class="tray" id="tray" data-zone="tray" aria-label="Pictures to sort">
    <div class="tray-top">
      <span class="count" id="count"></span>
      <button class="control" id="return-picture" type="button" disabled>Put back</button>
    </div>
    <div class="shelf" id="shelf"></div>
  </section>
  <p class="message" id="message" role="status" aria-atomic="true"></p>
  <div class="groups" id="groups" aria-label="Your groups"></div>
</main>

  ];
  const tray = document.getElementById('tray');
  const shelf = document.getElementById('shelf');
  const groups = document.getElementById('groups');
  const message = document.getElementById('message');
  const count = document.getElementById('count');
  const reset = document.getElementById('reset');
  const returnPicture = document.getElementById('return-picture');
  const cards = new Map();
  let selected = null;
  let drag = null;
  let suppressClickFor = null;
  let highlighted = null;
  const startMessage = 'What do your pictures have in common?';

  function addPicture(container, item) {
    container.style.setProperty('--picture-bg', item.color);
    const picture = document.createElement('img');
    picture.className = 'picture';
    picture.src = item.image;
    picture.alt = '';
    picture.draggable = false;
    container.append(picture, document.createTextNode(item.name));
  }

  function select(item) {
    selected = item;
    for (const [id, card] of cards) {
      card.setAttribute('aria-pressed', String(id === item?.id));
    }
    for (const group of groups.children) {
      const destination = group.querySelector('.placed-list');
      const canPlace = item !== null && cards.get(item.id).parentElement !== destination;
      group.classList.toggle('ready', canPlace);
      group.querySelector('.place-here').disabled = !canPlace;
    }
    returnPicture.disabled = item === null || cards.get(item.id).parentElement === shelf;
  }

  function place(zone, viaKeyboard = false) {
    if (!selected) return;
    const item = selected;
    const card = cards.get(item.id);
    const returning = zone === tray;
    const destination = returning ? shelf : zone.querySelector('.placed-list');
    if (card.parentElement === destination) return;
    destination.append(card);
    select(null);
    updateCount();
    const name = returning ? 'the picture tray' : zone.querySelector('.group-name').value.trim() || 'this group';
    message.textContent = shelf.children.length
      ? item.name + ' moved to ' + name + '.'
      : 'Tell why the pictures in each group belong together.';
    if (viaKeyboard) (shelf.querySelector('.card') || card).focus();
  }

  function updateCount() {
    const remaining = shelf.children.length;
    count.textContent = items.length - remaining + ' of ' + items.length + ' placed';
  }

  function highlight(zone) {
    if (highlighted === zone) return;
    highlighted?.classList.remove('is-over');
    highlighted = zone;
    highlighted?.classList.add('is-over');
  }

  function zoneAt(x, y) {
    return document.elementFromPoint(x, y)?.closest('[data-zone]') || null;
  }

  function clearDrag() {
    if (!drag) return;
    const previous = drag;
    drag = null;
    previous.ghost?.remove();
    if (previous.card.hasPointerCapture(previous.pointerId)) previous.card.releasePointerCapture(previous.pointerId);
    highlight(null);
  }

  function connectCard(card, item) {
    card.addEventListener('click', (event) => {
      if (suppressClickFor === card) {
        suppressClickFor = null;
        return;
      }
      select(selected === item ? null : item);
      message.textContent = selected ? 'Choose a group for ' + item.name.toLowerCase() + '.' : startMessage;
      if (selected && event.detail === 0) groups.querySelector('.place-here:not(:disabled)')?.focus();
    });
    card.addEventListener('pointerdown', (event) => {
      if (drag || event.button !== 0 || !event.isPrimary) return;
      drag = {item, card, pointerId: event.pointerId, x: event.clientX, y: event.clientY, ghost: null};
      card.setPointerCapture(event.pointerId);
    });
    card.addEventListener('pointermove', (event) => {
      if (drag?.pointerId !== event.pointerId) return;
      if (!drag.ghost && Math.hypot(event.clientX - drag.x, event.clientY - drag.y) < 8) return;
      if (!drag.ghost) {
        select(item);
        message.textContent = 'Slide the picture into a group.';
        const ghost = document.createElement('div');
        ghost.className = 'ghost';
        ghost.setAttribute('aria-hidden', 'true');
        ghost.style.width = Math.min(124, card.offsetWidth) + 'px';
        addPicture(ghost, item);
        document.body.append(ghost);
        drag.ghost = ghost;
      }
      drag.ghost.style.transform = 'translate(' + event.clientX + 'px, ' + event.clientY + 'px) translate(-50%, -50%)';
      highlight(zoneAt(event.clientX, event.clientY));
    });
    card.addEventListener('pointerup', (event) => {
      if (drag?.pointerId !== event.pointerId) return;
      const moved = Boolean(drag.ghost);
      if (moved) {
        suppressClickFor = card;
        setTimeout(() => { if (suppressClickFor === card) suppressClickFor = null; }, 0);
      }
      clearDrag();
      if (!moved) return;
      message.textContent = 'Choose a group for ' + item.name.toLowerCase() + '.';
      const zone = zoneAt(event.clientX, event.clientY);
      if (zone) place(zone);
    });
    function cancel(event) {
      if (drag?.pointerId !== event.pointerId) return;
      const moved = Boolean(drag.ghost);
      clearDrag();
      if (moved) message.textContent = 'Choose a group for ' + item.name.toLowerCase() + '.';
    }
    card.addEventListener('pointercancel', cancel);
    card.addEventListener('lostpointercapture', cancel);
  }

  function addGroup() {
    const number = groups.children.length + 1;
    const zone = document.createElement('section');
    zone.className = 'group';
    zone.dataset.zone = 'group';

    const name = document.createElement('input');
    name.className = 'group-name';
    name.placeholder = 'Name this group';
    name.maxLength = 48;
    name.autocomplete = 'off';
    name.setAttribute('aria-label', 'Name for group ' + number);

    const list = document.createElement('div');
    list.className = 'placed-list';

    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'control place-here';
    button.textContent = 'Put here';
    button.setAttribute('aria-label', 'Put picture in group ' + number);
    button.addEventListener('click', (event) => place(zone, event.detail === 0));
    name.addEventListener('input', () => {
      button.setAttribute('aria-label', 'Put picture in ' + (name.value.trim() || 'group ' + number));
    });
    zone.addEventListener('click', (event) => {
      if (!event.target.closest('button, input')) place(zone);
    });

    zone.append(name, list, button);
    groups.append(zone);
    select(selected);
    return name;
  }

  function shuffledItems() {
    const order = [...items];
    for (let index = order.length - 1; index > 0; index--) {
      const swap = Math.floor(Math.random() * (index + 1));
      [order[index], order[swap]] = [order[swap], order[index]];
    }
    return order;
  }

  function startRound(order) {
    clearDrag();
    cards.clear();
    shelf.replaceChildren();
    groups.replaceChildren();
    selected = null;
    addGroup();
    addGroup();
    for (const item of order) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'card';
      card.setAttribute('aria-pressed', 'false');
      addPicture(card, item);
      connectCard(card, item);
      cards.set(item.id, card);
      shelf.append(card);
    }
    updateCount();
    message.textContent = startMessage;
  }

  document.getElementById('add-group').addEventListener('click', () => addGroup().focus());
  returnPicture.addEventListener('click', (event) => place(tray, event.detail === 0));
  reset.addEventListener('click', (event) => {
    startRound(shuffledItems());
    if (event.detail === 0) shelf.querySelector('.card').focus();
  });
  startRound(items);
</script>
