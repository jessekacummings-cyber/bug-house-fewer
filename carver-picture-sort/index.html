<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carver’s Picture Sort</title>
<meta name="description" content="Sort illustrated crops and garden tools into groups you can name.">
<style>
:root{--ink:#223c2f;--muted:#556b60;--cream:#fffaf0;--paper:#fffdf7;--edge:#d5dfcb;--green:#285c45;--orange:#df9a3a;--focus:#1770a3;font-family:"Nunito","Trebuchet MS",sans-serif;color:var(--ink);background:#f8f4e9}
*{box-sizing:border-box}
body{margin:0;min-width:270px;background:radial-gradient(ellipse at 93% 0%,#e3eed7 0,transparent 38%),#f8f4e9;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
button[hidden]{display:none}
.wrap{max-width:1460px;padding:clamp(16px,3vw,38px);margin:auto}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:22px}
h1{font-size:clamp(32px,4.6vw,62px);line-height:1.02;margin:0 0 8px;font-weight:900;letter-spacing:-.045em}
header p{margin:0;color:var(--muted);line-height:1.5;font-size:clamp(16px,1.55vw,21px)}
.actions,.dialog-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.action{border:1px solid #aebfa5;border-radius:100px;color:var(--ink);background:var(--paper);padding:10px 15px;font-weight:800;white-space:nowrap;min-height:44px}
.action:hover{background:#edf3e2}
.action.primary{background:var(--green);border-color:var(--green);color:white}
.action.primary:hover{background:#204a38}
.bank,.group{border-radius:20px;border:1px solid var(--edge);min-width:0}
.bank{padding:13px 16px 15px;background:var(--paper);box-shadow:0 3px 14px #41532b0c}
.zone-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;min-height:45px}
.zone-head h2{margin:0;font-size:clamp(20px,2.25vw,28px);line-height:1.04;overflow-wrap:anywhere}
.bank-controls{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.count{color:var(--muted);font-weight:800;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(79px,100%),1fr));gap:8px;align-content:start}
.bank .cards{grid-template-columns:repeat(8,minmax(0,1fr));min-height:61px}
.card{display:grid;gap:2px;justify-items:center;align-content:center;min-width:0;padding:4px 5px 5px;min-height:68px;border-radius:11px;border:2px solid #e0e4d6;background:#faf7ed;color:var(--ink);font-weight:800;touch-action:none;user-select:none;cursor:grab;text-align:center}
.card img{width:100%;max-width:92px;max-height:83px;object-fit:contain;aspect-ratio:1;pointer-events:none;border-radius:6px}
.card span{font-size:clamp(12px,1.15vw,15px);line-height:1.15;overflow-wrap:anywhere}
.card[aria-pressed="true"]{border-color:var(--green);box-shadow:0 0 0 2px #b3ca96;transform:translateY(-1px)}
.card:hover{border-color:#93ae80}
.card:active{cursor:grabbing}
.group-grid{display:grid;grid-template-columns:repeat(var(--groups,2),minmax(0,1fr));gap:13px}
.group{padding:10px 12px 12px;min-height:145px;background:#e8f1dd;border:2px dashed #9ab582;transition:background .12s,border-color .12s}
.group:nth-child(2){background:#faecd2;border-color:#d4ae65}
.group:nth-child(3){background:#e4eef5;border-color:#92b2c9}
.group:nth-child(4){background:#f1e7f5;border-color:#ba9ac8}
.group .zone-head{margin-bottom:5px}
.group .cards{min-height:67px}
.group .card img{max-height:71px}
.group .blank-name{display:inline-block;width:clamp(42px,9vw,122px);height:.85em;border-bottom:3px solid currentColor;opacity:.53}
.place{padding:5px 11px;min-height:37px;font-size:14px;background:#fffdf7b8;border-color:#5679574d}
body[data-selected] .place{background:var(--green);color:white;border-color:var(--green)}
[data-zone].over{border-color:var(--green);box-shadow:0 0 0 3px #97bb87;background:#d8ecd4}
.status{margin:0;padding:12px 3px;min-height:48px;color:var(--green);font-weight:900;font-size:clamp(16px,1.7vw,21px)}
.ghost{position:fixed;z-index:20;left:0;top:0;width:106px;pointer-events:none;box-shadow:0 8px 20px #203b2840;transform:translate(-500px,-500px);border-color:var(--green)}
dialog{max-width:min(660px,calc(100vw - 24px));width:100%;max-height:calc(100vh - 28px);overflow:auto;border:1px solid var(--edge);padding:20px 22px;background:var(--paper);color:var(--ink);border-radius:18px;box-shadow:0 20px 80px #172d284a}
dialog::backdrop{background:#253a34a8}
dialog h2{margin:0 0 12px;font-size:31px}
dialog legend{font-weight:900;font-size:20px}
fieldset{border:1px solid var(--edge);padding:10px 12px 12px;margin:0 0 12px;border-radius:12px;min-width:0}
.group-field{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.group-field label{min-width:61px;font-weight:800}
.group-field input{min-width:0;flex:1;padding:8px 9px;border:1px solid #91a990;border-radius:8px;color:var(--ink);background:white}
.group-field .action{padding:6px 9px;min-height:38px;font-size:.9rem}
.group-field .action:disabled,#add-group:disabled{opacity:.5;cursor:default}
.check-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 11px;margin:7px 0 6px}
.check-grid label,.names-option{display:flex;gap:7px;align-items:center;min-height:29px;cursor:pointer}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--green);flex:none}
.dialog-actions{justify-content:flex-end;margin-top:12px}
.setting-note{font-size:.93rem;color:var(--muted);margin:5px 0 0}
#error{min-height:1.2em;color:#93522a;font-weight:800;margin:0}
@media(max-width:820px){.bank .cards{grid-template-columns:repeat(6,minmax(0,1fr))}.group-grid[style*="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){header{display:block;margin-bottom:13px}.actions{margin-top:12px}.bank .cards{grid-template-columns:repeat(4,minmax(0,1fr))}.group-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.group .zone-head{flex-wrap:wrap;gap:6px}.group{padding:10px;min-height:125px}.group .cards{grid-template-columns:repeat(2,minmax(0,1fr))}.place{padding:5px 9px}.wrap{padding:13px}.group-field label{min-width:49px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
<header>
  <div><h1>Carver’s Picture Sort</h1><p>Name a picture. Drag it to a group, or tap the picture and then its group.</p></div>
  <div class="actions"><button class="action" id="reset" type="button">Start over</button><button class="action primary" id="settings" type="button">Groups &amp; cards</button></div>
</header>
<section class="bank" data-zone="bank" aria-labelledby="pictures-heading">
  <div class="zone-head"><h2 id="pictures-heading">Pictures</h2><div class="bank-controls"><span class="count" id="count"></span><button class="action place" type="button" data-place="bank" id="put-back" hidden>Put back</button></div></div>
  <div class="cards" id="bank"></div>
</section>
<p class="status" id="status" role="status" aria-live="polite">Tell why the pictures in a group go together.</p>
<div class="group-grid" id="groups"></div>
</main>
<dialog id="editor" aria-labelledby="settings-title">
<form id="setup">
  <h2 id="settings-title">Groups &amp; cards</h2>
  <fieldset><legend>Group names</legend><div id="group-fields"></div>
    <div class="actions"><button class="action" id="add-group" type="button">Add a group</button><button class="action" id="blank-groups" type="button">Clear names</button></div>
    <p class="setting-note">Leave names blank for students to name the groups.</p>
  </fieldset>
  <fieldset><legend>Pictures to use</legend>
    <div class="check-grid" id="picture-options"></div>
    <label class="names-option"><input id="show-names" type="checkbox">Show picture names on the board</label>
  </fieldset>
  <p role="alert" id="error"></p>
  <div class="dialog-actions"><button class="action" type="button" id="cancel">Cancel</button><button class="action primary" type="submit">Apply</button></div>
</form>
</dialog>

const pictureById = new Map(pictures.map(picture => [picture.id, picture]));
const storageKey = 'carver-picture-sort-v1';
const defaults = {groups:[{id:'1',name:'Crops'},{id:'2',name:'Garden tools'}], cards:pictures.map(picture => picture.id), showNames:true, places:{}};

function readBoard() {
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey));
    if (saved && Array.isArray(saved.groups) && saved.groups.length >= 2 && saved.groups.length <= 4 &&
      saved.groups.every(group => typeof group.id === 'string' && typeof group.name === 'string') &&
      new Set(saved.groups.map(group => group.id)).size === saved.groups.length &&
      Array.isArray(saved.cards) && saved.cards.some(id => pictureById.has(id))) {
      return {...saved, cards:[...new Set(saved.cards.filter(id => pictureById.has(id)))], places:saved.places ?? {}};
    }
  } catch {}
  return structuredClone(defaults);
}
let board = readBoard();
let selected = null;
let drag = null;
let draftGroups = [];
let cardOrder = shuffled(pictures.map(picture => picture.id));
const status = document.querySelector('#status');
const groups = document.querySelector('#groups');
const bank = document.querySelector('#bank');
const count = document.querySelector('#count');
const putBack = document.querySelector('#put-back');
const dialog = document.querySelector('#editor');
const settings = document.querySelector('#settings');
const groupFields = document.querySelector('#group-fields');
const pictureOptions = document.querySelector('#picture-options');
const namesOption = document.querySelector('#show-names');
const error = document.querySelector('#error');

function persist() {
  try { localStorage.setItem(storageKey, JSON.stringify(board)); } catch {}
}
function shuffled(ids) {
  const order = [...ids];
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  return order;
}
function zoneOf(id) {
  const zone = board.places[id];
  return board.groups.some(group => group.id === zone) ? zone : 'bank';
}
function groupName(id) {
  const index = board.groups.findIndex(group => group.id === id);
  return board.groups[index]?.name || 'group ' + (index + 1);
}
function newCard(picture) {
  const card = document.createElement('button');
  card.type = 'button';
  card.className = 'card';
  card.dataset.card = picture.id;
  card.setAttribute('aria-label', picture.name);
  card.setAttribute('aria-pressed', String(selected === picture.id));
  const img = document.createElement('img');
  img.src = picture.src;
  img.alt = '';
  img.draggable = false;
  card.append(img);
  if (board.showNames) {
    const label = document.createElement('span');
    label.textContent = picture.name;
    card.append(label);
  }
  return card;
}
function draw() {
  const zoneCards = new Map([['bank', bank]]);
  bank.replaceChildren();
  groups.replaceChildren();
  groups.style.setProperty('--groups', board.groups.length);
  for (const [index, entry] of board.groups.entries()) {
    const zone = document.createElement('section');
    zone.className = 'group';
    zone.dataset.zone = entry.id;
    const heading = document.createElement('h2');
    heading.id = 'group-name-' + index;
    zone.setAttribute('aria-labelledby', heading.id);
    if (entry.name) {
      heading.textContent = entry.name;
    } else {
      heading.setAttribute('aria-label', groupName(entry.id));
      const line = document.createElement('span');
      line.setAttribute('aria-hidden','true');
      line.className = 'blank-name';
      heading.append(line);
    }
    const header = document.createElement('div');
    header.className = 'zone-head';
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'action place';
    button.dataset.place = entry.id;
    button.textContent = 'Place here';
    button.setAttribute('aria-label', 'Place picture in ' + groupName(entry.id));
    header.append(heading, button);
    const list = document.createElement('div');
    list.className = 'cards';
    zone.append(header, list);
    groups.append(zone);
    zoneCards.set(entry.id, list);
  }
  for (const id of cardOrder.filter(id => board.cards.includes(id))) {
    zoneCards.get(zoneOf(id)).append(newCard(pictureById.get(id)));
  }
  const placed = board.cards.filter(id => zoneOf(id) !== 'bank').length;
  count.textContent = placed + ' of ' + board.cards.length + ' placed';
  updateSelection();
}
function updateSelection() {
  document.body.toggleAttribute('data-selected', Boolean(selected));
  putBack.hidden = !(selected && zoneOf(selected) !== 'bank');
  for (const card of document.querySelectorAll('[data-card]')) {
    card.setAttribute('aria-pressed', String(card.dataset.card === selected));
  }
}
function select(id) {
  selected = id;
  updateSelection();
  if (id) status.textContent = 'Choose a group for ' + pictureById.get(id).name.toLowerCase() + '.';
  else status.textContent = 'Tell why the pictures in a group go together.';
}
function place(id, destination) {
  if (!id) {
    status.textContent = 'Choose a picture first.';
    return;
  }
  if (destination === 'bank') delete board.places[id];
  else board.places[id] = destination;
  selected = null;
  persist();
  draw();
  status.textContent = board.cards.every(card => zoneOf(card) !== 'bank')
    ? 'All pictures placed. Tell why each group goes together.'
    : pictureById.get(id).name + (destination === 'bank' ? ' went back to Pictures.' : ' went into ' + groupName(destination) + '.');
}
function zoneAt(event) {
  return document.elementFromPoint(event.clientX, event.clientY)?.closest('[data-zone]') ?? null;
}
function finishDrag() {
  const previous = drag;
  drag = null;
  previous.ghost?.remove();
  if (previous.card.hasPointerCapture(previous.pointer)) previous.card.releasePointerCapture(previous.pointer);
  document.querySelectorAll('.over').forEach(zone => zone.classList.remove('over'));
}
document.querySelector('main').addEventListener('pointerdown', event => {
  const card = event.target.closest('[data-card]');
  if (!card || drag || !event.isPrimary || event.button !== 0) return;
  drag = {card, pointer:event.pointerId, x:event.clientX, y:event.clientY, ghost:null};
  card.setPointerCapture(event.pointerId);
});
document.addEventListener('pointermove', event => {
  if (drag?.pointer !== event.pointerId) return;
  if (!drag.ghost && Math.hypot(event.clientX - drag.x, event.clientY - drag.y) < 7) return;
  if (!drag.ghost) {
    select(drag.card.dataset.card);
    const ghost = drag.card.cloneNode(true);
    ghost.removeAttribute('data-card');
    ghost.classList.add('ghost');
    ghost.setAttribute('aria-hidden','true');
    ghost.tabIndex = -1;
    document.body.append(ghost);
    drag.ghost = ghost;
  }
  drag.ghost.style.transform = 'translate(' + event.clientX + 'px,' + event.clientY + 'px) translate(-50%,-50%)';
  const target = zoneAt(event);
  for (const zone of document.querySelectorAll('[data-zone]')) zone.classList.toggle('over', zone === target);
});
let preventCardClick = null;
document.addEventListener('pointerup', event => {
  if (drag?.pointer !== event.pointerId) return;
  const card = drag.card;
  const target = drag.ghost ? zoneAt(event) : null;
  if (drag.ghost) {
    preventCardClick = card;
    setTimeout(() => { if (preventCardClick === card) preventCardClick = null; }, 350);
  }
  finishDrag();
  if (target) place(card.dataset.card, target.dataset.zone);
});
for (const type of ['pointercancel','lostpointercapture']) {
  document.addEventListener(type, event => { if (drag?.pointer === event.pointerId) finishDrag(); });
}
document.querySelector('main').addEventListener('click', event => {
  const card = event.target.closest('[data-card]');
  const targetButton = event.target.closest('[data-place]');
  const zone = event.target.closest('[data-zone]');
  if (card) {
    if (preventCardClick === card) { preventCardClick = null; return; }
    select(selected === card.dataset.card ? null : card.dataset.card);
    if (selected && event.detail === 0) groups.querySelector('[data-place]').focus();
  } else if (targetButton || (zone && selected)) {
    const destination = targetButton?.dataset.place ?? zone.dataset.zone;
    const id = selected;
    place(id, destination);
    if (id && event.detail === 0) document.querySelector('[data-card="' + id + '"]')?.focus();
  }
});

function drawGroupFields() {
  groupFields.replaceChildren();
  draftGroups.forEach((group, index) => {
    const row = document.createElement('div');
    row.className = 'group-field';
    const label = document.createElement('label');
    label.htmlFor = 'edit-group-' + index;
    label.textContent = 'Group ' + (index + 1);
    const input = document.createElement('input');
    input.id = label.htmlFor;
    input.value = group.name;
    input.placeholder = '';
    input.maxLength = 32;
    input.addEventListener('input', () => { group.name = input.value; });
    const remove = document.createElement('button');
    remove.className = 'action';
    remove.type = 'button';
    remove.textContent = 'Remove';
    remove.setAttribute('aria-label','Remove group ' + (index + 1));
    remove.disabled = draftGroups.length <= 2;
    remove.addEventListener('click', () => { draftGroups.splice(index,1); drawGroupFields(); });
    row.append(label,input,remove);
    groupFields.append(row);
  });
  document.querySelector('#add-group').disabled = draftGroups.length >= 4;
}
settings.addEventListener('click', () => {
  draftGroups = board.groups.map(group => ({...group}));
  drawGroupFields();
  pictureOptions.replaceChildren();
  for (const picture of pictures) {
    const label = document.createElement('label');
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.value = picture.id;
    input.checked = board.cards.includes(picture.id);
    label.append(input, document.createTextNode(picture.name));
    pictureOptions.append(label);
  }
  namesOption.checked = board.showNames;
  error.textContent = '';
  dialog.showModal();
});
document.querySelector('#add-group').addEventListener('click', () => {
  if (draftGroups.length >= 4) return;
  const id = String(Math.max(0, ...board.groups.map(group => Number(group.id)), ...draftGroups.map(group => Number(group.id))) + 1);
  draftGroups.push({id,name:''});
  drawGroupFields();
  groupFields.querySelector('.group-field:last-child input').focus();
});
document.querySelector('#blank-groups').addEventListener('click', () => {
  draftGroups.forEach(group => {group.name = '';});
  drawGroupFields();
  groupFields.querySelector('input').focus();
});
document.querySelector('#cancel').addEventListener('click', () => dialog.close());
document.querySelector('#setup').addEventListener('submit', event => {
  event.preventDefault();
  const chosen = [...pictureOptions.querySelectorAll('input:checked')].map(input => input.value);
  if (!chosen.length) {
    error.textContent = 'Choose at least one picture.';
    pictureOptions.querySelector('input').focus();
    return;
  }
  board.groups = draftGroups.map(group => ({...group,name:group.name.trim()}));
  board.cards = chosen;
  board.showNames = namesOption.checked;
  board.places = Object.fromEntries(Object.entries(board.places).filter(([id,zone]) => chosen.includes(id) && board.groups.some(group => group.id === zone)));
  selected = null;
  persist();
  draw();
  status.textContent = 'Tell why the pictures in a group go together.';
  dialog.close();
});
document.querySelector('#reset').addEventListener('click', () => {
  board.places = {};
  cardOrder = shuffled(cardOrder);
  select(null);
  persist();
  draw();
  status.textContent = 'New round. Choose a picture to sort.';
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && !dialog.open && selected) select(null);
});
draw();
</script>
</body>
</html>
